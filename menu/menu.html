<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>菜單 Menu</title>
<style>
  @page { size: A4; margin: 0; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    background: #ffffff;
  }

  :root {
    --ink:   #2A2620;
    --muted: #6E6656;
    --gold:  #9C7A3C;
    --line:  #C9BC9D;
    --paper: #FAF7F1;
  }

  .cn { font-family: 'STKaiti', '华文楷体', 'KaiTi', '微軟正黑體', serif; }
  .en {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-feature-settings: "liga" 1;
  }

  .page {
    position: relative;
    width: 210mm;
    height: 297mm;
    background: var(--paper);
    padding: 21mm 24mm;
    overflow: hidden;
  }

  .frame { position: absolute; inset: 11mm; border: 0.5px solid var(--line); }

  .content {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* ---------- Header ---------- */
  .kicker {
    font-size: 8.5pt;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--gold);
    padding-left: 0.42em;
  }

  .title {
    font-size: 34pt;
    letter-spacing: 0.55em;
    color: var(--ink);
    margin-top: 7mm;
    padding-left: 0.55em;
    line-height: 1.1;
  }

  .title-en {
    font-size: 11pt;
    letter-spacing: 0.16em;
    color: var(--muted);
    margin-top: 3.5mm;
  }

  .rule {
    width: 46mm;
    height: 0;
    border-top: 0.6px solid var(--line);
    margin-top: 7.5mm;
  }

  /* ---------- Body ---------- */
  .menu {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .section { margin-top: 11mm; }
  .section:first-child { margin-top: 0; }

  .sec-head {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.6mm;
  }
  .sec-cn {
    font-size: 11pt;
    letter-spacing: 0.5em;
    padding-left: 0.5em;
    color: var(--ink);
  }
  .sec-en {
    font-size: 7.5pt;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--gold);
    padding-left: 0.32em;
  }

  .items { margin-top: 5.4mm; display: flex; flex-direction: column; gap: 6.2mm; }

  .dish { display: flex; flex-direction: column; align-items: center; gap: 1.4mm; }
  .dish-cn { font-size: 14.5pt; letter-spacing: 0.22em; padding-left: 0.22em; color: var(--ink); }
  .dish-en { font-size: 9pt; letter-spacing: 0.04em; color: var(--muted); }

  /* ---------- Footer ---------- */
  .footer {
    margin-top: 4mm;
    font-size: 8pt;
    letter-spacing: 0.28em;
    color: var(--muted);
    padding-left: 0.28em;
  }
  .footer .en { font-size: 8.5pt; letter-spacing: 0.12em; }
</style>
</head>
<body>
  <div class="page">
    <div class="frame"></div>
    <div class="content">

      <div class="kicker en">Seasonal &nbsp;·&nbsp; &#192; la carte</div>

      <div class="title cn">菜單</div>
      <div class="title-en en">Menu</div>

      <div class="rule"></div>

      <div class="menu">

        <!-- 主菜 -->
        <div class="section">
          <div class="sec-head">
            <div class="sec-cn cn">主菜</div>
            <div class="sec-en en">Main Courses</div>
          </div>
          <div class="items">
            <div class="dish">
              <div class="dish-cn cn">金湯咖喱肥牛</div>
              <div class="dish-en en">Sliced Beef in Golden Curry</div>
            </div>
            <div class="dish">
              <div class="dish-cn cn">手撕嫩雞</div>
              <div class="dish-en en">Hand-Torn Chicken</div>
            </div>
          </div>
        </div>

        <!-- 時蔬 -->
        <div class="section">
          <div class="sec-head">
            <div class="sec-cn cn">時蔬</div>
            <div class="sec-en en">Vegetables</div>
          </div>
          <div class="items">
            <div class="dish">
              <div class="dish-cn cn">清炒時令時蔬</div>
              <div class="dish-en en">Wok-Tossed Seasonal Greens</div>
            </div>
            <div class="dish">
              <div class="dish-cn cn">白灼爽脆生菜</div>
              <div class="dish-en en">Blanched Crisp Lettuce</div>
            </div>
          </div>
        </div>

        <!-- 主食 -->
        <div class="section">
          <div class="sec-head">
            <div class="sec-cn cn">主食</div>
            <div class="sec-en en">Rice</div>
          </div>
          <div class="items">
            <div class="dish">
              <div class="dish-cn cn">香軟白飯</div>
              <div class="dish-en en">Steamed Jasmine Rice</div>
            </div>
          </div>
        </div>

        <!-- 飲品 -->
        <div class="section">
          <div class="sec-head">
            <div class="sec-cn cn">飲品</div>
            <div class="sec-en en">Beverages</div>
          </div>
          <div class="items">
            <div class="dish">
              <div class="dish-cn cn">精選飲品</div>
              <div class="dish-en en">Selected Beverages</div>
            </div>
          </div>
        </div>

      </div>

      <div class="footer cn">請慢用 &nbsp;·&nbsp; <span class="en">Enjoy</span></div>

    </div>
  </div>
</body>
</html>
